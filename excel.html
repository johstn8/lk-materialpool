<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Abitur-Planer in Excel öffnen</title>
  </head>
  <body>
    <p>Öffne den Abitur-Planer in Excel Web: <a id="excel-link" href="#" rel="noopener">Link wird geladen…</a></p>
    <script>
      const fileUrl = `https://johstn8.github.io/lk-materialpool/assets/documents/abitur-planer-berlin.xlsx?v=${Date.now()}`;
      const targetUrl = `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(fileUrl)}&activeCell=%27README%27!A1`;
      const link = document.getElementById('excel-link');
      link.href = targetUrl;
      link.textContent = 'Abitur-Planer in Excel Web öffnen';
    </script>
  </body>
</html>
